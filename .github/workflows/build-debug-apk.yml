name: Build & Release Debug APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
      - 'V*'
  release:
    types:
      - published
      - created
      - edited
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Assemble FleetCRM Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Prepare Environment, Firebase Config & Debug Keystore
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "516884045684",
              "project_id": "gen-lang-client-0224613684",
              "storage_bucket": "gen-lang-client-0224613684.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:516884045684:android:e82c86f29629e76e78d621",
                  "android_client_info": {
                    "package_name": "com.aistudio.travelcrm.vxqplm"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "516884045684-47l5mnlo2b8r8j69a6abescn185l1797.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.aistudio.travelcrm.vxqplm",
                      "certificate_hash": "ed63d84629f83c5710636ee304753236d9ca5ec4"
                    }
                  },
                  {
                    "client_id": "516884045684-92nuek0n4f1eq0mrhdnrghia6nicse5e.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyAKmAMsehZlQd2a5PYwqX5dQ5vlRuyrSxA"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "516884045684-92nuek0n4f1eq0mrhdnrghia6nicse5e.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            echo "Provisioned app/google-services.json for CI build"
          fi

          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "Restored debug.keystore from debug.keystore.base64"
            else
              echo "" | base64 -d > debug.keystore
              echo "Restored provisioned debug.keystore"
            fi
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk FleetCRM-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FleetCRM-debug-apk
          path: |
            FleetCRM-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct-Download APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ (github.event_name == 'release' && github.event.release.tag_name) || (github.ref_type == 'tag' && github.ref_name) || format('v1.0.{0}', github.run_number) }}
          name: "FleetCRM Debug APK (Build #${{ github.run_number }})"
          body: |
            ### FleetCRM — Travel CRM & Admin Operations Command Center (Debug APK)
            - **Repository:** `${{ github.repository }}`
            - **Package ID:** `com.aistudio.travelcrm.vxqplm`
            - **Commit:** `${{ github.sha }}`
            - **Direct 1-Click APK Download:** [Download FleetCRM-debug.apk](https://github.com/${{ github.repository }}/releases/latest/download/FleetCRM-debug.apk)
          files: |
            FleetCRM-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write Direct Download Links to Job Summary
        run: |
          echo "## 🚀 FleetCRM Debug APK Ready" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct APK Download (Latest Release):** [https://github.com/${{ github.repository }}/releases/latest/download/FleetCRM-debug.apk](https://github.com/${{ github.repository }}/releases/latest/download/FleetCRM-debug.apk)" >> $GITHUB_STEP_SUMMARY
          echo "- **Releases Page:** [https://github.com/${{ github.repository }}/releases](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY
